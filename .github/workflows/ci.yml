name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versiya `package.json` dagi `packageManager` maydonidan olinadi.
      # Bu yerda `version:` ni ham yozish `ERR_PNPM_BAD_PM_VERSION` beradi —
      # aynan shu sabab CI 2026-07-25 dan beri har safar yiqilib kelgan.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @tty/shared boshqa paketlarga `dist` sifatida kerak.
      - name: Build shared
        run: pnpm --filter @tty/shared build

      # ESLint — HAQIQIY lint. Avval bu qadam faqat `tsc --noEmit` edi (tip tekshiruvi),
      # ya'ni ishlatilmagan o'zgaruvchi/import kabi narsalar CI'dan o'tib ketardi.
      - name: Lint
        run: pnpm lint

      # Tip tekshiruvi endi lint'dan alohida qadam.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm -r build

      # Unit testlar (pricing / billing / dispatch tie-break).
      - name: Test
        run: pnpm -r test
